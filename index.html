<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sillage</title>
    
    <meta name="theme-color" content="#F9FAFB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sillage">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg: #F9FAFB;
            --surface: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --accent: #0F172A;
            --border: #E5E7EB;
            --danger: #EF4444;
            --epiphanie: #D4AF37;
            
            --font-main: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }
        
        .nav-item {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            cursor: pointer;
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        
        .nav-item:hover, .nav-item.active {
            color: var(--text-primary);
            border-bottom-color: var(--text-primary);
        }

        /* Composants de base */
        button {
            width: 100%;
            padding: 16px 24px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            border: none;
            font-weight: 600;
            font-family: var(--font-sans);
        }

        .btn-primary { background-color: var(--accent); color: #FFFFFF; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-primary); }
        .btn-outline:active { background-color: var(--surface); }

        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background-color: var(--surface); outline: none; }
        input:focus { border-color: var(--accent); }

        /* Écrans de Pause (Intégration / Prêt) */
        .empty-state-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 1.5s ease-in-out;
            flex-grow: 1;
        }

        .introspection-title {
            font-family: var(--font-main);
            font-size: 1.75rem;
            font-weight: 400;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .introspection-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .breathing-circle {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            margin-bottom: 32px;
            animation: breathe 4s infinite ease-in-out;
        }

        .btn-commitment {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 14px 32px;
            font-family: var(--font-main);
            font-size: 1.1rem;
            border-radius: 4px;
            width: auto;
        }
        .btn-commitment:hover { background: var(--surface); border-color: var(--accent); }

        /* Vue Étape Active */
        .quest-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .stats {
            text-align: center;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 600;
        }

        .category {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 24px;
            font-weight: 600;
        }
        .category.epiphanie { color: var(--epiphanie); }

        .quest-text {
            font-family: var(--font-main);
            font-size: 2rem;
            line-height: 1.3;
            text-align: center;
            font-weight: 400;
            color: var(--accent);
            margin-bottom: 48px;
        }

        .actions { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .btn-skip {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-skip:active:not(:disabled) { background-color: var(--surface); }
        .btn-skip:disabled { opacity: 0.4; cursor: not-allowed; }

        .joker-count {
            background-color: var(--bg);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
        }

        /* Sillage (Historique) */
        .journal-list { display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }
        .journal-item { background-color: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .journal-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        .journal-text { font-family: var(--font-main); font-size: 1.2rem; color: var(--text-primary); line-height: 1.4; }

        .hidden { display: none !important; }

        @keyframes breathe {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Auth -->
    <div class="container" id="auth-screen">
        <div style="margin-top: 10vh;">
            <h1 style="font-family: var(--font-main); font-size: 2.5rem; text-align: center; margin-bottom: 2rem;">Sillage</h1>
            <button class="btn-primary" onclick="app.startLocalMode()">Continuer en Local</button>
            <div style="border-top: 1px dashed var(--border); margin: 24px 0;"></div>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px;">Synchronisation Cloud (GitHub Gist)</p>
            <div class="form-group">
                <input type="text" id="gist-id" placeholder="ID du Gist" autocomplete="off">
            </div>
            <div class="form-group">
                <input type="password" id="github-token" placeholder="Token GitHub" autocomplete="off">
            </div>
            <div id="error-msg" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 16px;"></div>
            <button class="btn-outline" id="btn-sync" onclick="app.startCloudMode()">Connecter</button>
        </div>
    </div>

    <!-- App -->
    <div class="container hidden" id="app-screen">
        <nav>
            <div class="nav-item active" onclick="app.switchTab('quest')" id="tab-quest">Le Chemin</div>
            <div class="nav-item" onclick="app.switchTab('journal')" id="tab-journal">Le Sillage</div>
        </nav>

        <div id="view-quest">
            <div class="stats" id="step-display">Étape 1</div>

            <main class="quest-area">
                
                <!-- 1. État : Intégration (Cooldown 5 jours) -->
                <div id="integration-state" class="empty-state-container hidden">
                    <div class="breathing-circle"></div>
                    <p class="introspection-text">Laissez vos récentes actions décanter.<br>Le temps fait son œuvre.</p>
                </div>

                <!-- 2. État : Prêt -->
                <div id="ready-state" class="empty-state-container hidden">
                    <h2 class="introspection-title">Un nouveau chemin se présente.</h2>
                    <p class="introspection-text">Ne l'acceptez que si vous avez l'espace mental pour vous y consacrer.</p>
                    <button class="btn-commitment" onclick="engine.drawQuest()">Faire le premier pas</button>
                </div>

                <!-- 3. État : Action (Étape Active) -->
                <div id="active-quest-state" class="hidden" style="width: 100%;">
                    <div class="category" id="quest-category">Catégorie</div>
                    <h1 class="quest-text" id="quest-text">Texte</h1>
                    
                    <div class="actions" style="margin-top: 48px;">
                        <button class="btn-primary" onclick="engine.completeQuest()">Marquer comme accomplie</button>
                        <button class="btn-skip" id="btn-skip" onclick="engine.skipQuest()">
                            <span>Emprunter un détour</span>
                            <span class="joker-count" id="joker-display">0 Détour</span>
                        </button>
                    </div>
                </div>
            </main>
        </div>

        <div id="view-journal" class="hidden">
            <div id="journal-list" class="journal-list"></div>
        </div>
    </div>

    <script>
        // TODO: Colle ici l'intégralité du JSON généré précédemment contenant les 80 quêtes
        const QUESTS_DB = [
            {id: 1, category: "Exploration", text: "Suis une odeur intéressante dans la rue jusqu'à sa source.", rarity: "common"},
            {id: 73, category: "Épiphanie", text: "Retourne seul(e) sur le lieu d'un souvenir marquant. Note ce que ça te fait aujourd'hui, pas hier.", rarity: "epic"}
            // ... Ajoute le reste ici
        ];

        const StorageManager = {
            KEYS: { STATE: 'sillage_state', GIST_ID: 'sillage_gist_id', TOKEN: 'sillage_token' },
            data: { 
                questsCompletedCount: 0, 
                completedQuestIds: [], 
                availableDetours: 0,
                currentQuest: null, // { id, acceptedAt }
                lastCompletedAt: null, // Timestamp de la dernière complétion
                history: []
            },
            isCloud: false,

            init() {
                const token = localStorage.getItem(this.KEYS.TOKEN);
                const gistId = localStorage.getItem(this.KEYS.GIST_ID);
                if (token && gistId) {
                    this.isCloud = true;
                    app.startCloudMode(true);
                } else {
                    this.loadLocal();
                    if(localStorage.getItem('sillage_mode') === 'local') app.startLocalMode();
                }
            },

            loadLocal() {
                try {
                    const raw = localStorage.getItem(this.KEYS.STATE);
                    if (raw) this.data = JSON.parse(raw);
                } catch (e) { console.error("Erreur state", e); }
            },

            async fetchGist(gistId, token) {
                const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!res.ok) throw new Error("API Error");
                const gist = await res.json();
                const file = gist.files['sillage_state.json'];
                return file && file.content.trim() ? JSON.parse(file.content) : this.data;
            },

            async save() {
                localStorage.setItem(this.KEYS.STATE, JSON.stringify(this.data));
                if (this.isCloud) {
                    const token = localStorage.getItem(this.KEYS.TOKEN);
                    const gistId = localStorage.getItem(this.KEYS.GIST_ID);
                    try {
                        await fetch(`https://api.github.com/gists/${gistId}`, {
                            method: 'PATCH',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ files: { 'sillage_state.json': { content: JSON.stringify(this.data, null, 2) } } })
                        });
                    } catch (e) { console.warn("Cloud save failed."); }
                }
            }
        };

        const engine = {
            COOLDOWN_MS: 5 * 24 * 60 * 60 * 1000, // 5 jours purs

            drawQuest() {
                const state = StorageManager.data;
                const nextStep = state.questsCompletedCount + 1;
                const isEpiphanie = (nextStep % 15 === 0);
                
                let available = QUESTS_DB.filter(q => !state.completedQuestIds.includes(q.id));
                if (available.length === 0) return alert("Le chemin est achevé.");

                if (isEpiphanie) {
                    const epics = available.filter(q => q.rarity === 'epic');
                    if (epics.length > 0) available = epics; 
                } else {
                    available = available.filter(q => q.rarity !== 'epic');
                    if(available.length === 0) available = QUESTS_DB.filter(q => !state.completedQuestIds.includes(q.id));
                }

                const drawn = available[Math.floor(Math.random() * available.length)];
                
                state.currentQuest = { id: drawn.id, acceptedAt: Date.now() };
                StorageManager.save();
                app.renderQuestState();
            },

            completeQuest() {
                const state = StorageManager.data;
                const quest = QUESTS_DB.find(q => q.id === state.currentQuest.id);
                
                state.history.unshift({
                    id: quest.id, text: quest.text, category: quest.category, completedAt: Date.now()
                });
                
                state.completedQuestIds.push(quest.id);
                state.questsCompletedCount++;
                state.lastCompletedAt = Date.now();
                
                // 1 Détour gagné toutes les 6 étapes
                if (state.questsCompletedCount % 6 === 0) {
                    state.availableDetours = Math.min(1, state.availableDetours + 1);
                }
                
                state.currentQuest = null;
                StorageManager.save();
                app.renderQuestState();
                app.renderJournal();
            },

            skipQuest() {
                const state = StorageManager.data;
                if (state.availableDetours > 0) {
                    state.availableDetours--;
                    state.completedQuestIds.push(state.currentQuest.id); 
                    state.currentQuest = null;
                    StorageManager.save();
                    app.renderQuestState();
                }
            }
        };

        const app = {
            startLocalMode() {
                localStorage.setItem('sillage_mode', 'local');
                StorageManager.isCloud = false;
                StorageManager.loadLocal();
                this.boot();
            },

            async startCloudMode(isAuto = false) {
                const btn = document.getElementById('btn-sync');
                const err = document.getElementById('error-msg');
                let gistId = localStorage.getItem(StorageManager.KEYS.GIST_ID);
                let token = localStorage.getItem(StorageManager.KEYS.TOKEN);

                if (!isAuto) {
                    gistId = document.getElementById('gist-id').value.trim();
                    token = document.getElementById('github-token').value.trim();
                }

                if (!gistId || !token) { err.textContent = "Champs requis."; return; }

                try {
                    if(btn) btn.textContent = "Connexion...";
                    const remoteData = await StorageManager.fetchGist(gistId, token);
                    localStorage.setItem(StorageManager.KEYS.GIST_ID, gistId);
                    localStorage.setItem(StorageManager.KEYS.TOKEN, token);
                    localStorage.setItem('sillage_mode', 'cloud');
                    
                    StorageManager.isCloud = true;
                    StorageManager.data = remoteData;
                    StorageManager.save(); 
                    this.boot();
                } catch (e) {
                    err.textContent = "Échec de connexion.";
                    if(btn) btn.textContent = "Connecter";
                    if (isAuto) this.startLocalMode();
                }
            },

            boot() {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                this.renderQuestState();
                this.renderJournal();
            },

            switchTab(tab) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.getElementById(`tab-${tab}`).classList.add('active');
                document.getElementById('view-quest').classList.add('hidden');
                document.getElementById('view-journal').classList.add('hidden');
                document.getElementById(`view-${tab}`).classList.remove('hidden');
            },

            renderQuestState() {
                const state = StorageManager.data;
                const now = Date.now();
                
                document.getElementById('step-display').textContent = `Étape ${state.questsCompletedCount + 1}`;

                const integrationEl = document.getElementById('integration-state');
                const readyEl = document.getElementById('ready-state');
                const activeEl = document.getElementById('active-quest-state');

                // Réinitialiser l'affichage
                integrationEl.classList.add('hidden');
                readyEl.classList.add('hidden');
                activeEl.classList.add('hidden');

                if (state.currentQuest) {
                    // Étape en cours
                    activeEl.classList.remove('hidden');
                    const q = QUESTS_DB.find(x => x.id === state.currentQuest.id);
                    
                    const catEl = document.getElementById('quest-category');
                    catEl.textContent = q.category === 'Legendary' ? 'Épiphanie' : q.category;
                    catEl.className = `category ${q.rarity === 'epic' ? 'epiphanie' : ''}`;
                    document.getElementById('quest-text').textContent = q.text;
                    
                    // Gestion du bouton Détour
                    const btnSkip = document.getElementById('btn-skip');
                    document.getElementById('joker-display').textContent = `${state.availableDetours} Détour${state.availableDetours > 1 ? 's':''}`;
                    btnSkip.disabled = state.availableDetours === 0;

                } else {
                    // Vérification du Cooldown
                    if (state.lastCompletedAt && (now - state.lastCompletedAt < engine.COOLDOWN_MS)) {
                        integrationEl.classList.remove('hidden');
                    } else {
                        readyEl.classList.remove('hidden');
                    }
                }
            },

            renderJournal() {
                const state = StorageManager.data;
                const list = document.getElementById('journal-list');
                
                if (state.history.length === 0) {
                    list.innerHTML = '<p style="text-align:center; color:var(--text-secondary); font-style:italic; margin-top:40px;">Aucune trace pour le moment.</p>';
                    return;
                }

                list.innerHTML = state.history.map(item => {
                    const d = new Date(item.completedAt);
                    const dateStr = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getFullYear()}`;
                    const catName = item.category === 'Legendary' ? 'Épiphanie' : item.category;
                    
                    return `
                        <div class="journal-item">
                            <div class="journal-meta">
                                <span style="${item.category === 'Legendary' ? 'color:var(--epiphanie)' : ''}">${catName}</span>
                                <span>${dateStr}</span>
                            </div>
                            <div class="journal-text">${item.text}</div>
                        </div>
                    `;
                }).join('');
            }
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
        }

        StorageManager.init();
    </script>
</body>
</html>
